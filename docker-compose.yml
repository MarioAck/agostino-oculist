version: "3.8"

services:
  agostino-oculist:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agostino-oculist
    ports:
      - "3000:3000"
    # No volumes - data and uploads stored inside container (ephemeral)
    # Data will be lost on container restart/rebuild
    # To enable persistence, uncomment and fix permissions:
    # volumes:
    #   - ./data:/app/data
    #   - ./public/uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
