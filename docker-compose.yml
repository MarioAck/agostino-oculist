version: "3.8"

services:
  agostino-oculist:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agostino-oculist
    ports:
      - "3000:3000"
    volumes:
      # Mount data directory to persist item changes
      - ./data:/app/data
      # Mount uploads directory to persist uploaded images
      - ./public/uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
